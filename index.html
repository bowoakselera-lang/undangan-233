<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <!-- Mengambil font estetik dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #4A5D4E; /* Sage green gelap untuk teks */
            --light-green: #899B8C;
            --gold: #C5A880;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #e8ece9; /* Warna dasar pastel */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container utama seukuran layar HP */
        .mobile-container {
            width: 100%;
            max-width: 414px; /* Ukuran standar mobile */
            height: 100vh;
            max-height: 896px;
            position: relative;
            /* Background bunga botani pastel (bisa diganti link gambarnya) */
            background-image: url('https://images.unsplash.com/photo-1490750967868-88cb4ecb0701?q=80&w=600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Overlay gelap sedikit agar teks terbaca */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        /* Efek Glasshouse / Frosted Glass dengan bentuk Arch (Lengkung) */
        .glass-arch {
            position: relative;
            z-index: 2;
            width: 85%;
            height: 85%;
            /* Efek Kaca / Glassmorphism */
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            /* Bentuk kubah di atas */
            border-radius: 150px 150px 15px 15px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 3rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Tipografi */
        .intro {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--dark-green);
            text-transform: uppercase;
            margin-bottom: 20px;
            margin-top: 20px;
        }

        .couple-names {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: var(--dark-green);
            line-height: 1.2;
            margin: 10px 0;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        .and {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--gold);
            margin: -5px 0;
        }

        .date {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--dark-green);
            letter-spacing: 2px;
            margin-top: 30px;
            border-top: 1px solid var(--gold);
            border-bottom: 1px solid var(--gold);
            padding: 10px 0;
            width: 80%;
        }

        .message {
            font-size: 0.75rem;
            color: var(--dark-green);
            margin-top: 30px;
            font-weight: 400;
        }

        .btn-open {
            background-color: var(--dark-green);
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            border: 1px solid var(--dark-green);
        }

        .btn-open:hover {
            background-color: transparent;
            color: var(--dark-green);
        }

        /* Hiasan daun/bunga tambahan di sudut (Opsional) */
        .floral-corner {
            position: absolute;
            width: 120px;
            opacity: 0.8;
            z-index: 3;
            pointer-events: none;
        }
        
        .floral-top {
            top: -20px;
            left: -20px;
            transform: rotate(15deg);
        }

    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="overlay"></div>
        
        <!-- Kartu Undangan Bentuk Kaca Lengkung -->
        <div class="glass-arch">
            
            <div class="top-section">
                <p class="intro">The Wedding Of</p>
                <!-- Nama Mempelai -->
                <h1 class="couple-names">Romeo</h1>
                <p class="and">&</p>
                <h1 class="couple-names">Juliet</h1>
            </div>

            <!-- Tanggal Acara -->
            <div class="date">
                12 . 12 . 2027
            </div>

            <div class="bottom-section">
                <p class="message">You are joyfully invited to<br>celebrate our special day</p>
                <br>
                <!-- Tombol Buka Undangan -->
                <a href="#" class="btn-open">Open Invitation</a>
            </div>
            
        </div>
    </div>

</body>
</html>
