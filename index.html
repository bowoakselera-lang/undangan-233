<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Felix & Angelina</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #23395d;
            --light-blue: #3d5a80;
            --bg-parchment: #fcfbf7;
            --text-color: #2b2d42;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1e2022;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Container Utama ukuran HP */
        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            background-color: var(--bg-parchment);
            position: relative;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }

        /* --- HALAMAN PERTAMA (COVER) --- */
        .cover-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-parchment);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 3rem 1.5rem;
            text-align: center;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
        }

        .cover-page.hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .cover-top-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--primary-blue);
            margin-top: 10px;
        }

        /* Ilustrasi Gazebo Doodle (Gaya Sketsa Biru) */
        .doodle-container {
            width: 80%;
            max-width: 250px;
            margin: 10px auto;
        }

        .doodle-container img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(35, 57, 93, 0.1));
        }

        .couple-names-cover {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--primary-blue);
            line-height: 1.2;
            margin: 10px 0;
        }

        .cover-ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--light-blue);
            font-style: italic;
            margin: -5px 0;
        }

        .wedding-date {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--text-color);
            margin-bottom: 20px;
        }

        /* Tombol Buka Undangan */
        .btn-open {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 12px 32px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(35, 57, 93, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-open:hover {
            background-color: var(--light-blue);
            transform: translateY(-2px);
        }

        /* --- HALAMAN ISI UNDANGAN (DIBALIK COVER) --- */
        .main-content {
            padding: 4rem 2rem;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .content-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: var(--primary-blue);
            margin-bottom: 1rem;
        }

        .content-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <div class="cover-page" id="coverPage">
            <div>
                <p class="cover-top-text">We Are Getting Married</p>
            </div>

            <div class="doodle-container">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=400&auto=format&fit=crop" alt="Gazebo Doodle Sketch" style="border-radius: 10px; opacity: 0.9;">
            </div>

            <div>
                <h1 class="couple-names-cover">Felix Alexander</h1>
                <div class="cover-ampersand">&</div>
                <h1 class="couple-names-cover">Angelina Grace</h1>
                <p class="wedding-date">Sunday, February 2nd 2026</p>
            </div>

            <div>
                <button class="btn-open" onclick="openInvitation()">Open Invitation</button>
            </div>
        </div>

        <div class="main-content">
            <h2 class="content-title">Welcome to Our Special Day</h2>
            <p class="content-text">
                Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa restu kepada kami.
            </p>
            
            <div style="margin-top: 50px; border-top: 1px solid #dcd7cd; padding-top: 30px;">
                <p style="font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--primary-blue); font-style: italic;">
                    "So they are no longer two, but one flesh..."
                </p>
            </div>
        </div>

    </div>

    <script>
        // Fungsi untuk membuka undangan (menyembunyikan cover dengan animasi)
        function openInvitation() {
            const cover = document.getElementById('coverPage');
            cover.classList.add('hidden');
        }
    </script>

</body>
</html>
